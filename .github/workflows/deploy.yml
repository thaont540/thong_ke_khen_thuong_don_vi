name: deploy
# develop -> staging (tự động). master -> production (chờ reviewer duyệt ở GitHub environment `production`).
# Chạy tay: Actions > deploy > Run workflow, chọn target.
on:
  push:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      target:
        description: Môi trường cần deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.target || 'auto' }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy-staging:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Thứ tự bắt buộc: build -> migrations -> deploy (migration chỉ thêm, tương thích bản Worker cũ)
      - run: CLOUDFLARE_ENV=staging npm run build
      - run: npx wrangler d1 migrations apply DB --env staging --remote
      - run: npx wrangler deploy
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            https://app-nghia-staging.mail-rac-289.workers.dev/api/health

  deploy-production:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    # Required reviewers cấu hình ở Settings > Environments > production
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            https://app-nghia.mail-rac-289.workers.dev/api/health
