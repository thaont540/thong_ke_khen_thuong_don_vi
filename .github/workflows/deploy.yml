name: deploy
# develop -> staging (tự động). master -> production (chờ reviewer duyệt ở GitHub environment `production`).
# Chạy tay: Actions > deploy > Run workflow, chọn target (production chỉ chạy được từ master).
# Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID đặt ở environment-level (staging, production);
# thiếu secret thì job báo ::warning:: và bỏ qua deploy (xanh nhưng có cảnh báo).
on:
  push:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      target:
        description: Môi trường cần deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# Một nhóm cho mỗi môi trường: push và dispatch tới cùng môi trường không chạy song song.
# Mỗi job đặt `concurrency` riêng nên không cần nhóm ở mức workflow.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy-staging:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Deploy staging bị bỏ qua::Thiếu secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID. Thêm vào GitHub environment staging (Settings > Environments > staging > Environment secrets). Chưa deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci
      # Thứ tự bắt buộc: build -> migrations -> deploy (migration chỉ thêm, tương thích bản Worker cũ)
      - if: steps.gate.outputs.enabled == 'true'
        run: CLOUDFLARE_ENV=staging npm run build
      - if: steps.gate.outputs.enabled == 'true'
        run: npx wrangler d1 migrations apply DB --env staging --remote
      - if: steps.gate.outputs.enabled == 'true'
        run: npx wrangler deploy
      - name: Smoke test
        if: steps.gate.outputs.enabled == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            https://app-nghia-staging.mail-rac-289.workers.dev/api/health

  deploy-production:
    needs: check
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || inputs.target == 'production')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Required reviewers + deployment branch = master cấu hình ở Settings > Environments > production
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Deploy production bị bỏ qua::Thiếu secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID. Thêm vào GitHub environment production (Settings > Environments > production > Environment secrets). Chưa deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci
      # Thứ tự bắt buộc: build -> migrations -> deploy (migration chỉ thêm, tương thích bản Worker cũ)
      - if: steps.gate.outputs.enabled == 'true'
        run: npm run build
      - if: steps.gate.outputs.enabled == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - if: steps.gate.outputs.enabled == 'true'
        run: npx wrangler deploy
      - name: Smoke test
        if: steps.gate.outputs.enabled == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            https://app-nghia.mail-rac-289.workers.dev/api/health
