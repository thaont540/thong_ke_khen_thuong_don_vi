name: backup-d1-weekly
# Export D1 production hằng tuần, mã hóa bằng age (khóa công khai) rồi mới upload artifact.
# File plaintext chỉ tồn tại trong runner, không bao giờ được upload.
on:
  schedule:
    - cron: "0 18 * * 0" # Chủ nhật 18:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BACKUP_AGE_RECIPIENT" ]; then
            echo "::warning title=Backup bị bỏ qua::Thiếu secret CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID hoặc BACKUP_AGE_RECIPIENT (Settings > Secrets and variables > Actions). Backup chưa chạy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci
      - name: Install age
        if: steps.gate.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Export, compress, encrypt
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          test -n "$BACKUP_AGE_RECIPIENT" || { echo "Thiếu secret BACKUP_AGE_RECIPIENT"; exit 1; }
          stamp="$(date -u +%Y%m%d-%H%M)"
          npx wrangler d1 export app-nghia --remote --output=backup.sql
          test -s backup.sql
          gzip -9 backup.sql
          age -r "$BACKUP_AGE_RECIPIENT" -o "app-nghia-${stamp}.sql.gz.age" backup.sql.gz
          shred -u backup.sql.gz || rm -f backup.sql.gz
          ls -l ./*.age
          echo "BACKUP_FILE=app-nghia-${stamp}.sql.gz.age" >> "$GITHUB_ENV"
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d1-backup-${{ github.run_id }}
          path: "*.sql.gz.age"
          if-no-files-found: error
          retention-days: 90
